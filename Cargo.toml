[package]
name = "naal-focus"
version = "0.9.0"
edition = "2024"
rust-version = "1.93"
description = "A mindful attention reminder applet for COSMIC"
publish = false

[features]
default = []
applet = ["dep:libcosmic", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation", "dep:objc2-core-graphics"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
fontdue = "=0.9.4"
unicode-properties = { version = "=0.1.4", default-features = false, features = ["general-category"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "=5.19.0", features = ["blocking-api"] }
smithay-client-toolkit = "=0.21.1"
wayland-client = "=0.31.15"
wayland-protocols = { version = "=0.32.13", features = ["client", "staging"] }
cosmic-protocols = { git = "https://github.com/pop-os/cosmic-protocols", rev = "c0cff4d", default-features = false, features = ["client"] }

[target.'cfg(target_os = "linux")'.dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic"
rev = "6af8b7051b6e6c3a9d0c42c3b2fc5a14a80afe36"
default-features = false
features = ["applet-token", "tokio", "a11y", "single-instance", "process"]
optional = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "=0.6.4", optional = true }
objc2-foundation = { version = "=0.3.2", optional = true }
objc2-core-graphics = { version = "=0.3.2", optional = true, default-features = false, features = ["std", "CGSession", "CGEventSource", "CGEventTypes"] }
objc2-app-kit = { version = "=0.3.2", optional = true, default-features = false, features = ["std", "objc2-core-foundation", "NSApplication", "NSRunningApplication", "NSResponder", "NSWindow", "NSView", "NSMenu", "NSMenuItem", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSButtonCell", "NSControl", "NSCell", "NSTextField", "NSText", "NSTextView", "NSTextContainer", "NSScrollView", "NSClipView", "NSAlert", "NSGraphics", "NSGraphicsContext", "NSBitmapImageRep", "NSImageRep", "NSColor", "NSFont", "NSFontDescriptor", "NSParagraphStyle", "NSWorkspace", "NSScreen", "NSEvent", "NSPopUpButton", "NSImage"] }

[[bin]]
name = "naal-focus"
path = "src/bin/applet.rs"
required-features = ["applet"]

[[bin]]
name = "naal-focus-overlay"
path = "src/bin/overlay.rs"

[[example]]
name = "settings-preview"
required-features = ["applet"]

[profile.release]
lto = "thin"
strip = true
