<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Naal Focus · Breathing studies</title>
<style>
:root{color-scheme:dark;--bg:#111418;--panel:#191d22;--line:#30363b;--ink:#e4e5df;--muted:#929a9c;--accent:#b7c9b9;font-family:Inter,ui-sans-serif,system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,select{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:5px}button:disabled{cursor:default;opacity:.45}.page{max-width:1560px;min-width:760px;margin:auto;padding:28px 40px 24px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}.title{display:flex;align-items:baseline;gap:19px}h1{font-size:24px;font-weight:450;letter-spacing:-.7px;margin:0}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}.actions{display:flex;align-items:center;gap:10px}.control{background:transparent;border:1px solid var(--line);border-radius:7px;padding:9px 13px;font-size:12px}.control:hover{background:#242a2f}.primary{background:var(--accent);color:#1b2520;border-color:var(--accent)}.primary:hover{background:#c9d7ca}.studies{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}.study{border:1px solid var(--line);background:var(--panel);border-radius:10px;position:relative;padding:14px 17px;text-align:left;overflow:hidden;transition:border-color .3s,background .3s}.study:hover{background:#20262b}.study[aria-pressed=true]{border-color:var(--accent);background:#1c2423}.study-top{display:flex;justify-content:space-between;align-items:center;font-size:13px}.number{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}.mini{height:69px;display:grid;place-items:center;position:relative;margin:2px 0 7px;overflow:hidden}.description{font-size:11px;color:var(--muted)}.mini-ring{width:41px;height:41px;border:1px solid #bed0c3;border-radius:50%;animation:mini-breath 8s ease-in-out infinite}.mini-glow{width:65px;height:55px;border-radius:50%;background:radial-gradient(ellipse,#d7c5a07a,transparent 69%);animation:mini-breath 8s ease-in-out infinite}.mini-tide{width:140px;height:50px;position:relative}.mini-tide:before,.mini-tide:after{content:"";position:absolute;left:0;right:0;bottom:6px;height:27px;border-top:1px solid #a6c5c7;border-radius:50%;animation:mini-wave 8s ease-in-out infinite}.mini-tide:after{bottom:-1px;opacity:.35;animation-delay:-1s}.mini-flower{width:48px;height:48px;position:relative;animation:mini-breath 8s ease-in-out infinite}.mini-flower i{position:absolute;width:22px;height:36px;left:13px;top:0;border:1px solid #cbbcd2aa;border-radius:50%;transform-origin:50% 24px;transform:rotate(calc(var(--i)*60deg))}@keyframes mini-breath{0%,100%{transform:scale(.72);opacity:.5}42%{transform:scale(1.1);opacity:1}}@keyframes mini-wave{0%,100%{transform:translateY(8px);opacity:.3}42%{transform:translateY(-6px);opacity:.9}}
.preview-shell{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#15191e}.preview-bar{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line);font-size:11px;color:var(--muted)}.preview-title{display:flex;align-items:center;gap:10px}.dot{width:5px;height:5px;background:var(--accent);border-radius:50%}.stage{height:clamp(350px,49vh,700px);min-height:350px;position:relative;overflow:hidden;isolation:isolate;background:#252b31}.stage:fullscreen{height:100vh;width:100vw}.desktop{position:absolute;inset:0;background:radial-gradient(ellipse at 18% 90%,#354945,transparent 65%),#283039;display:grid;place-items:center}.editor{width:73%;height:78%;border-radius:8px;background:#1b2027;box-shadow:0 15px 80px #0005;overflow:hidden;transform:perspective(1200px) rotateX(1deg);opacity:.85}.editor-bar{height:32px;background:#242a31;border-bottom:1px solid #353b42;display:flex;gap:6px;align-items:center;padding-left:14px;color:#9da6ad;font-size:10px}.editor-bar i{width:6px;height:6px;background:#616a71;border-radius:50%}.editor-bar span{margin-left:20px}.editor-body{height:calc(100% - 32px);display:flex}.files{width:20%;border-right:1px solid #2b3139;padding:20px 17px;font-size:10px;line-height:2.6;color:#89939e}.code{padding:24px 28px;flex:1}.code-line{height:5px;margin-bottom:14px;background:#687f8d55;border-radius:3px;width:var(--w)}.code-line:nth-child(3n){background:#a4b29d55;margin-left:19px}.code-line:nth-child(4n){background:#b2a18f66}.veil{position:absolute;inset:0;background:rgba(20,23,29,.94);opacity:0;z-index:1}.breathing{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;flex-direction:column;opacity:0;pointer-events:none}.visual{width:270px;height:230px;display:grid;place-items:center;position:relative}.art{position:absolute;inset:0;display:none;align-items:center;justify-content:center}.art.active{display:flex}.ring{position:absolute;width:144px;height:144px;border-radius:50%;border:1px solid #b6cbb9;box-shadow:0 0 26px #afc8b409,inset 0 0 26px #afc8b409}.ring-outer{width:204px;height:204px;border-color:#b6cbb91a;box-shadow:none}.ring-core{width:5px;height:5px;border:0;background:#c8d6c9;box-shadow:0 0 20px #c8d6c96b}.glow{position:absolute;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,#ebd8b763 0%,#ceb78b35 25%,#b3a48212 48%,transparent 69%)}.glow-core{width:130px;height:130px;background:radial-gradient(circle,#f3dfbe40,transparent 70%)}.tide-art svg{width:310px;height:190px;overflow:visible}.petal{position:absolute;width:76px;height:125px;border:1px solid #cfbdd490;border-radius:50%;background:radial-gradient(ellipse at 50% 85%,#c6aed80c,transparent 70%);transform-origin:50% 100%;bottom:50%;left:calc(50% - 38px)}.flower-center{width:5px;height:5px;background:#d6c6dc;border-radius:50%}.cue{font-size:20px;font-weight:350;letter-spacing:.3px;height:29px;margin-top:15px;color:#e3e6df}.breath-progress{width:76px;height:1px;background:#e3e6df14;margin-top:21px;overflow:hidden}.breath-progress span{display:block;height:100%;width:100%;background:#b7c9b980;transform:scaleX(0);transform-origin:left}.reflection{z-index:3;position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;visibility:hidden;pointer-events:none;padding:40px}.reflection.visible{visibility:visible;pointer-events:auto}.quote{font-size:clamp(22px,2.5vw,36px);font-weight:350;letter-spacing:-.7px;text-align:center;line-height:1.45;margin:0 0 26px}.reflection input{width:min(510px,80%);padding:14px 3px;background:none;border:0;border-bottom:1px solid #c0c8c346;color:var(--ink);font:inherit;font-size:15px;outline:none;border-radius:0}.reflection input:focus{border-color:var(--accent)}.reflection input::placeholder{color:#969e9c}.reflection .saved{height:20px;margin-top:15px;font-size:11px;color:var(--accent)}.stage-exit{position:absolute;z-index:4;bottom:18px;right:20px;color:#bdc6c280;font-size:10px;border:0;background:none;padding:8px}.stage-exit:hover{color:var(--ink)}.timeline{display:flex;align-items:center;gap:0;padding:19px 2px 0}.step{display:flex;align-items:center;gap:8px;font-size:11px;color:#788185;white-space:nowrap}.step.active{color:var(--accent)}.step.done{color:#b0b8b3}.step b{font-weight:400;color:inherit;font-variant-numeric:tabular-nums}.connector{height:1px;background:var(--line);flex:1;margin:0 18px}.foot{display:flex;justify-content:space-between;margin-top:20px;color:#788185;font-size:10px;line-height:1.6}.pace{display:flex;gap:9px;align-items:center}select{background:#1b2025;color:#b7c1bc;border:1px solid var(--line);border-radius:5px;padding:5px 8px;font-size:11px}.stage:fullscreen .quote{font-size:36px}.stage:fullscreen .visual{transform:scale(1.3);margin-bottom:35px}.stage:fullscreen .cue{font-size:24px}@media(max-height:780px){.page{padding-top:20px}header{margin-bottom:18px}.mini{height:48px}.studies{margin-bottom:14px}.foot{margin-top:13px}}@media(prefers-reduced-motion:reduce){.mini *{animation:none!important}.mini-flower{animation:none}.description{line-height:1.4}}
</style>
</head>
<body>
<main class="page">
<header><div class="title"><h1>Breathing studies</h1><span class="eyebrow">Naal Focus / exploration</span></div><div class="actions"><button class="control" id="fullscreen">Full screen ↗</button><button class="control primary" id="replay">Replay</button></div></header>
<section class="studies" aria-label="Animation styles">
<button class="study" data-style="ring" aria-pressed="true"><span class="study-top"><span>Ring</span><span class="number">01</span></span><span class="mini"><span class="mini-ring"></span></span><span class="description">A clear, quiet rhythm.</span></button>
<button class="study" data-style="glow" aria-pressed="false"><span class="study-top"><span>Glow</span><span class="number">02</span></span><span class="mini"><span class="mini-glow"></span></span><span class="description">Light instead of an outline.</span></button>
<button class="study" data-style="tide" aria-pressed="false"><span class="study-top"><span>Tide</span><span class="number">03</span></span><span class="mini"><span class="mini-tide"></span></span><span class="description">A slower change of scenery.</span></button>
<button class="study" data-style="unfold" aria-pressed="false"><span class="study-top"><span>Unfold</span><span class="number">04</span></span><span class="mini"><span class="mini-flower"><i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i><i style="--i:3"></i><i style="--i:4"></i><i style="--i:5"></i></span></span><span class="description">Something gently opening.</span></button>
</section>
<section class="preview-shell" aria-label="Overlay simulation">
<div class="preview-bar"><span class="preview-title"><span class="dot"></span><span id="style-name">Ring</span></span><span id="status" role="status">Ready</span></div>
<div class="stage" id="stage">
<div class="desktop" aria-hidden="true"><div class="editor"><div class="editor-bar"><i></i><i></i><i></i><span>Workspace — illustrative background</span></div><div class="editor-body"><div class="files">EXPLORER<br>src<br> &nbsp; components<br> &nbsp; workspace<br> &nbsp; index<br>tests<br>README</div><div class="code"><div class="code-line" style="--w:38%"></div><div class="code-line" style="--w:63%"></div><div class="code-line" style="--w:51%"></div><div class="code-line" style="--w:72%"></div><div class="code-line" style="--w:45%"></div><div class="code-line" style="--w:60%"></div><div class="code-line" style="--w:31%"></div><div class="code-line" style="--w:55%"></div><div class="code-line" style="--w:69%"></div><div class="code-line" style="--w:43%"></div><div class="code-line" style="--w:29%"></div></div></div></div></div>
<div class="veil" id="veil"></div>
<div class="breathing" id="breathing" aria-hidden="true"><div class="visual">
<div class="art active" data-art="ring"><div class="ring ring-outer"></div><div class="ring ring-main"></div><div class="ring ring-core"></div></div>
<div class="art" data-art="glow"><div class="glow"></div><div class="glow glow-core"></div></div>
<div class="art tide-art" data-art="tide"><svg viewBox="0 0 310 190" fill="none" aria-hidden="true"><defs><linearGradient id="wave-fade"><stop stop-color="#b1cfd0" stop-opacity="0"/><stop offset=".5" stop-color="#b1cfd0" stop-opacity=".9"/><stop offset="1" stop-color="#b1cfd0" stop-opacity="0"/></linearGradient></defs><path class="wave wave-one" stroke="url(#wave-fade)" stroke-width="1.2"/><path class="wave wave-two" stroke="url(#wave-fade)" stroke-opacity=".4" stroke-width="1"/><path class="wave wave-three" stroke="url(#wave-fade)" stroke-opacity=".17" stroke-width="1"/></svg></div>
<div class="art" data-art="unfold"><div class="petal" data-angle="0"></div><div class="petal" data-angle="60"></div><div class="petal" data-angle="120"></div><div class="petal" data-angle="180"></div><div class="petal" data-angle="240"></div><div class="petal" data-angle="300"></div><div class="flower-center"></div></div>
</div><div class="cue" id="cue">Breathe in</div><div class="breath-progress"><span id="progress"></span></div></div>
<form class="reflection" id="reflection" aria-hidden="true" inert><p class="quote">What has your attention?</p><input id="reflection-input" aria-label="Reflection" placeholder="What are you working on?" autocomplete="off" maxlength="500"><div class="saved" id="saved"></div></form>
<button class="stage-exit" id="skip" hidden>Skip breath ↗</button>
</div></section>
<div class="timeline" aria-label="Preview sequence"><span class="step" data-step="arrive"><b>01</b> Fade in</span><span class="connector"></span><span class="step" data-step="inhale"><b>02</b> Breathe in</span><span class="connector"></span><span class="step" data-step="exhale"><b>03</b> Breathe out</span><span class="connector"></span><span class="step" data-step="reflect"><b>04</b> Reflect</span></div>
<footer class="foot"><span>Standalone concept · simulated desktop · nothing is saved</span><div class="pace"><label for="pace">Pace</label><select id="pace"><option value="4,6">4s in / 6s out</option><option value="3,4">3s in / 4s out</option><option value="5,5">5s in / 5s out</option></select><span id="motion-note"></span></div></footer>
</main>
<script>
'use strict';
const $ = selector => document.querySelector(selector);
const $$ = selector => [...document.querySelectorAll(selector)];
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const names = {ring:'Ring',glow:'Glow',tide:'Tide',unfold:'Unfold'};
let style = 'ring', frame = 0, start = null, running = false, lastPhase = '', skipRequested = false;
const ease = n => (1 - Math.cos(Math.PI * Math.max(0, Math.min(1,n)))) / 2;
const clamp = n => Math.max(0, Math.min(1,n));
function phase(name, text) {
  if(lastPhase === name) return;
  lastPhase = name;
  $('#status').textContent = text;
  const order = ['arrive','inhale','exhale','reflect'];
  $$('.step').forEach(el => {el.classList.toggle('active', el.dataset.step === name);el.classList.toggle('done',order.indexOf(el.dataset.step) < order.indexOf(name));});
}
function draw(amount, elapsed) {
  const a = reduced ? .45 : amount;
  $('.ring-main').style.transform = `scale(${.64 + a * .62})`;
  $('.ring-main').style.opacity = .36 + a * .6;
  $('.ring-outer').style.transform = `scale(${.81 + a * .22})`;
  $('.glow').style.transform = `scale(${.61 + a * .67})`;
  $('.glow').style.opacity = .4 + a * .6;
  $('.glow-core').style.transform = `scale(${.7 + a * .45})`;
  $$('.petal').forEach(el => {
    const angle = Number(el.dataset.angle);
    el.style.transform = `rotate(${angle}deg) translateY(${-a * 12}px) scale(${.48 + a * .42}, ${.55 + a * .38})`;
    el.style.opacity = .3 + a * .6;
  });
  $$('.wave').forEach((el,i) => {
    const y = 126 - a * 65 + i * 13;
    const bend = 10 + a * 14;
    const drift = reduced ? 0 : Math.sin(elapsed * .45 + i * .7) * 8;
    el.setAttribute('d', `M -5 ${y} C 67 ${y-bend+drift}, 91 ${y-bend+drift}, 155 ${y} S 245 ${y+bend-drift}, 315 ${y}`);
  });
}
function showReflection() {
  running = false;
  $('#veil').style.opacity = 1;
  $('#breathing').style.opacity = 0;
  $('#reflection').classList.add('visible');
  $('#reflection').style.opacity = 1;
  $('#reflection').inert = false;
  $('#reflection').setAttribute('aria-hidden','false');
  $('#skip').hidden = true;
  phase('reflect','Reflection · preview only');
}
function replay() {
  cancelAnimationFrame(frame);
  running = true; start = null; lastPhase = ''; skipRequested = false;
  $('#reflection-input').blur();
  $('#reflection-input').value = '';
  $('#saved').textContent = '';
  $('#reflection').classList.remove('visible');
  $('#reflection').inert = true;
  $('#reflection').setAttribute('aria-hidden','true');
  $('#reflection').style.opacity = 0;
  $('#veil').style.opacity = 0;
  $('#breathing').style.opacity = 0;
  $('#skip').hidden = true;
  $('#style-name').textContent = names[style];
  $$('.art').forEach(el => el.classList.toggle('active',el.dataset.art === style));
  const [inhale,exhale] = $('#pace').value.split(',').map(Number);
  const arrival = 2, breathStart = arrival, outStart = breathStart + inhale, end = outStart + exhale;
  function tick(now) {
    if(!running) return;
    if(start === null) start = now;
    const t = (now-start)/1000;
    if(skipRequested) {showReflection();return;}
    $('#veil').style.opacity = ease(t / 1.8);
    $('#breathing').style.opacity = ease((t-.6)/1.3) * (1-ease((t-end)/1.1));
    $('#skip').hidden = t < 1.8 || t >= end;
    if(t < breathStart) {phase('arrive','Arriving');$('#cue').textContent = 'Breathe in';draw(0,t);}
    else if(t < outStart) {phase('inhale','Breathe in');$('#cue').textContent = 'Breathe in';draw(ease((t-breathStart)/inhale),t);}
    else if(t < end) {phase('exhale','Breathe out');$('#cue').textContent = 'Breathe out';draw(1-ease((t-outStart)/exhale),t);}
    else {draw(0,t);phase('settle','Settling');}
    $('#progress').style.transform = `scaleX(${clamp((t-breathStart)/(inhale+exhale))})`;
    if(t >= end+.8) {
      $('#reflection').classList.add('visible');
      $('#reflection').style.opacity = ease((t-end-.8)/1.2);
    }
    if(t >= end+2) {showReflection();return;}
    frame = requestAnimationFrame(tick);
  }
  frame = requestAnimationFrame(tick);
}
$$('.study').forEach(button => button.addEventListener('click', () => {
  style = button.dataset.style;
  $$('.study').forEach(el => el.setAttribute('aria-pressed',String(el === button)));
  replay();
}));
$('#replay').addEventListener('click',replay);
$('#pace').addEventListener('change',replay);
$('#skip').addEventListener('click',() => {skipRequested = true;});
$('#fullscreen').addEventListener('click',async () => {
  try {if(document.fullscreenElement) await document.exitFullscreen();else await $('#stage').requestFullscreen();replay();}
  catch {$('#status').textContent = 'Full screen unavailable · preview below';}
});
$('#reflection').addEventListener('submit', event => {event.preventDefault();$('#saved').textContent = $('#reflection-input').value.trim() ? 'Preview only — not saved' : '';});
document.addEventListener('keydown', event => {
  if(event.key === 'Escape' && running) skipRequested = true;
});
// Freeze the preview while hidden so a breath is not missed in another tab.
document.addEventListener('visibilitychange', () => {
  if(document.hidden && running) {cancelAnimationFrame(frame);running = false;}
  else if(!document.hidden && $('#reflection').inert) replay();
});
if(reduced) $('#motion-note').textContent = 'Reduced motion';
// Query parameters make each direction directly shareable and testable.
const requested = new URLSearchParams(location.search).get('style');
if(Object.hasOwn(names,requested)) {
  style = requested;
  $$('.study').forEach(el => el.setAttribute('aria-pressed',String(el.dataset.style === style)));
}
replay();
</script>
</body>
</html>
