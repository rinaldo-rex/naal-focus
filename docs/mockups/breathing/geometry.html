<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Naal Focus · Seeded geometry</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#e2e6df;background:#101418;--line:#30383b;--muted:#929d9c;--accent:#bed4c5}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button,a,input,select{-webkit-tap-highlight-color:transparent}button{cursor:pointer;color:inherit}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:4px}button:hover{background:#28322f}button:disabled{opacity:.45;cursor:default}a{color:var(--muted);text-decoration:none}a:hover{color:var(--accent)}main{min-width:780px;max-width:1560px;margin:auto;padding:28px 38px}header{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:25px}h1{font-size:24px;font-weight:450;letter-spacing:-.7px;margin:0}.title{display:flex;align-items:baseline;gap:18px}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:1.8px;color:var(--muted)}.tools{display:flex;align-items:center;gap:8px}.button{border:1px solid var(--line);background:transparent;border-radius:7px;padding:9px 12px;font-size:12px;white-space:nowrap}.primary{background:var(--accent);border-color:var(--accent);color:#18261e}.primary:hover{background:#d2e2d4}.seed-form{display:flex;align-items:center;gap:8px}.seed-form label{font-size:11px;color:var(--muted);margin-right:3px}.seed-form input{background:#181e21;border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:135px;font:12px ui-monospace,monospace;color:#d3ddd3}.families{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.family{position:relative;border:1px solid var(--line);border-radius:10px;background:#181e22;text-align:left;padding:13px 16px 12px;overflow:hidden}.family[aria-pressed=true]{border-color:var(--accent);background:#1c2525}.family-top{display:flex;justify-content:space-between;font-size:13px}.index{color:var(--muted);font-size:10px}.family canvas{display:block;width:100%;height:85px}.family-detail{display:block;font-size:10px;color:var(--muted)}.shell{border:1px solid var(--line);border-radius:12px;overflow:hidden}.bar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:10px 15px;border-bottom:1px solid var(--line);font-size:11px;color:var(--muted)}.bar-left{display:flex;gap:12px;align-items:center}.light{width:5px;height:5px;border-radius:50%;background:var(--accent)}.switch{display:flex;background:#101518;border:1px solid var(--line);border-radius:6px;padding:2px;gap:2px}.switch button{border:0;background:none;color:var(--muted);padding:5px 12px;font-size:11px;border-radius:3px}.switch button[aria-pressed=true]{background:#303b38;color:#e0e8e0}.stage{height:clamp(390px,50vh,720px);position:relative;overflow:hidden;background:#252d32;isolation:isolate}.stage:fullscreen{height:100vh;width:100vw}.desktop{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 15% 80%,#3d5148,transparent 65%),#29333d}.window{width:72%;height:75%;border-radius:8px;background:#1d242b;box-shadow:0 20px 80px #0004;padding:20px 28px;color:#81918e;font-size:10px}.window-label{padding-bottom:17px;border-bottom:1px solid #3f484c;margin-bottom:24px}.window i{height:4px;display:block;margin:15px 0;background:#718d9555;width:var(--width);border-radius:3px}.veil{position:absolute;inset:0;background:rgba(18,23,28,.96);z-index:1}.scene{position:absolute;inset:0;z-index:2;pointer-events:none}#geometry{display:block;width:100%;height:100%}.breath-label{position:absolute;bottom:24px;left:0;right:0;text-align:center;pointer-events:none}.cue{font-size:18px;font-weight:350;letter-spacing:.2px}.progress{width:64px;height:1px;background:#d3dfd51c;margin:14px auto 0}.progress span{display:block;width:100%;height:100%;background:#bed4c580;transform-origin:left}.skip{position:absolute;right:17px;bottom:17px;z-index:5;border:0;background:transparent;color:#aab9b280;font-size:10px;padding:8px}.skip:hover{color:#d6e3d8}.reflection{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;flex-direction:column;visibility:hidden;opacity:0;pointer-events:none}.reflection.visible{visibility:visible;pointer-events:auto}.reflection p{font-size:clamp(24px,2.4vw,36px);font-weight:350;letter-spacing:-.7px;margin:0 0 27px}.reflection input{width:min(490px,75%);border:0;border-bottom:1px solid #a4b5aa66;background:none;padding:13px 2px;color:#e2e6df;font-size:14px;border-radius:0}.reflection input::placeholder{color:#9ba7a2}.saved{height:16px;margin-top:14px;font-size:11px;color:var(--accent)}.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:20px}.signature{font-size:11px;color:#b0bcb5}.signature span{font-family:ui-monospace,monospace;color:#778a82;margin-left:10px}.playback{display:flex;align-items:center;gap:8px}.playback label{font-size:10px;color:var(--muted)}select{background:#1a2225;border:1px solid var(--line);border-radius:6px;color:#c1cdc5;padding:7px 9px;font-size:11px}.foot{display:flex;align-items:center;justify-content:space-between;color:#77867f;font-size:10px;margin-top:21px;gap:20px}.status{min-width:115px;text-align:right}.stage:fullscreen .breath-label{bottom:9vh}.stage:fullscreen .cue{font-size:24px}.stage:fullscreen .reflection p{font-size:36px}@media(max-width:1100px){main{padding:22px 25px}.title{display:block}.eyebrow{display:block;margin-top:8px}.tools{gap:6px}.seed-form{gap:5px}.seed-form input{width:100px}.family{padding:12px}.family-detail{font-size:9px}}@media(max-height:800px){main{padding-top:20px}header{margin-bottom:18px}.family canvas{height:65px}.families{margin-bottom:14px}.stage{height:390px}.foot{margin-top:15px}}
</style>
</head>
<body>
<main>
<header><div class="title"><h1>Seeded geometry</h1><span class="eyebrow">Naal Focus / study 02</span></div><div class="tools"><form class="seed-form" id="seed-form"><label for="seed">Seed</label><input id="seed" aria-label="Pattern seed" maxlength="48" spellcheck="false" autocomplete="off"><button class="button" type="submit">Apply</button></form><button class="button primary" id="reroll">New seed ↻</button><button class="button" id="fullscreen">Full screen ↗</button></div></header>
<section class="families" aria-label="Pattern families">
<button class="family" data-family="lattice" aria-pressed="true"><span class="family-top">Radial lattice <span class="index">01</span></span><canvas aria-hidden="true"></canvas><span class="family-detail">Spokes open into a geometric bloom.</span></button>
<button class="family" data-family="polygons" aria-pressed="false"><span class="family-top">Nested polygons <span class="index">02</span></span><canvas aria-hidden="true"></canvas><span class="family-detail">Layered outlines turn in counterpoint.</span></button>
<button class="family" data-family="constellation" aria-pressed="false"><span class="family-top">Constellation <span class="index">03</span></span><canvas aria-hidden="true"></canvas><span class="family-detail">A connected field finds more space.</span></button>
<button class="family" data-family="weave" aria-pressed="false"><span class="family-top">Woven field <span class="index">04</span></span><canvas aria-hidden="true"></canvas><span class="family-detail">A regular grid bends around a breath.</span></button>
</section>
<section class="shell" aria-label="Generative overlay preview">
<div class="bar"><span class="bar-left"><span class="light"></span><span id="family-name">Radial lattice</span></span><div class="switch" aria-label="Playback mode"><button data-mode="study" aria-pressed="true">Study loop</button><button data-mode="overlay" aria-pressed="false">Overlay entrance</button></div><span class="status" id="status" role="status">Arriving</span></div>
<div class="stage" id="stage">
<div class="desktop" aria-hidden="true"><div class="window"><div class="window-label">Workspace · illustrative background</div><i style="--width:38%"></i><i style="--width:65%"></i><i style="--width:52%"></i><i style="--width:71%"></i><i style="--width:48%"></i><i style="--width:58%"></i><i style="--width:32%"></i><i style="--width:66%"></i></div></div>
<div class="veil" id="veil"></div>
<div class="scene" id="scene" aria-hidden="true"><canvas id="geometry"></canvas><div class="breath-label"><div class="cue" id="cue">Breathe in</div><div class="progress"><span id="progress"></span></div></div></div>
<form class="reflection" id="reflection" aria-hidden="true" inert><p>What has your attention?</p><input id="reflection-input" aria-label="Reflection" placeholder="What are you working on?" autocomplete="off" maxlength="500"><div class="saved" id="saved"></div></form>
<button class="skip" id="skip" hidden>Skip breath ↗</button>
</div>
</section>
<div class="bottom"><div class="signature" id="signature"></div><div class="playback"><label for="pace">Pace</label><select id="pace"><option value="4,6">4s in / 6s out</option><option value="3,4">3s in / 4s out</option><option value="5,5">5s in / 5s out</option></select><button class="button" id="pause" aria-pressed="false">Pause</button><button class="button" id="replay">Replay seed ↻</button></div></div>
<footer class="foot"><a href="index.html">← Original breathing studies</a><span id="note">Same seed, same geometry. No random changes during a breath.</span><span>HTML concept · nothing saved</span></footer>
</main>
<script>
'use strict';
const $ = selector => document.querySelector(selector);
const $$ = selector => [...document.querySelectorAll(selector)];
const TAU = Math.PI * 2;
const names = {lattice:'Radial lattice',polygons:'Nested polygons',constellation:'Constellation',weave:'Woven field'};
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = n => Math.max(0,Math.min(1,n));
const ease = n => (1-Math.cos(Math.PI*clamp(n)))/2;
const lerp = (a,b,t) => a+(b-a)*t;
// FNV-1a hashes text; a small integer PRNG generates all parameters up front.
function hash(text) {let h=2166136261;for(const c of text){h^=c.codePointAt(0);h=Math.imul(h,16777619);}return h>>>0;}
function random(seed) {let a=seed;return () => {a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t^=t+Math.imul(t^(t>>>7),61|t);return ((t^(t>>>14))>>>0)/4294967296;};}
function newSeed() {return crypto.getRandomValues(new Uint32Array(1))[0].toString(36).padStart(7,'0');}
function generate(seed,family) {
  const rand=random(hash(seed+'::'+family));
  const int=(min,max)=>min+Math.floor(rand()*(max-min+1));
  const m={family,hue:lerp(130,185,rand()),rotation:rand()*TAU,direction:rand()>.5?1:-1};
  if(family==='lattice') {Object.assign(m,{spokes:int(7,14),rings:int(3,6),twist:lerp(.1,.6,rand()),skip:int(1,3)});}
  if(family==='polygons') {Object.assign(m,{sides:int(3,8),layers:int(5,9),twist:lerp(.12,.5,rand()),step:lerp(.04,.14,rand())});m.hue=lerp(25,65,rand());}
  if(family==='constellation') {
    m.hue=lerp(165,205,rand());m.points=Array.from({length:int(28,43)},(_,i)=>{const angle=i*2.399963229728653+rand()*.4;const radius=Math.sqrt((i+.5)/43)*lerp(.84,1.13,rand());return {x:Math.cos(angle)*radius,y:Math.sin(angle)*radius,phase:rand()*TAU,weight:lerp(.7,1.5,rand())};});
    m.edges=[];const seen=new Set();
    // Fix nearest-neighbour topology at generation time: links never pop in/out.
    m.points.forEach((p,i)=>m.points.map((q,j)=>({j,d:(p.x-q.x)**2+(p.y-q.y)**2})).filter(q=>q.j!==i).sort((a,b)=>a.d-b.d||a.j-b.j).slice(0,3).forEach(({j})=>{const key=[Math.min(i,j),Math.max(i,j)].join(':');if(!seen.has(key)){seen.add(key);m.edges.push([i,j]);}}));
  }
  if(family==='weave') {Object.assign(m,{count:int(9,15),frequency:lerp(1,2.1,rand()),bend:lerp(.12,.25,rand()),phase:rand()*TAU,tilt:lerp(-.35,.35,rand())});m.hue=lerp(270,310,rand());}
  return m;
}
function describe(m) {
  if(m.family==='lattice')return `${m.spokes}-fold symmetry · ${m.rings} rings`;
  if(m.family==='polygons')return `${m.sides} sides · ${m.layers} layers`;
  if(m.family==='constellation')return `${m.points.length} points · ${m.edges.length} fixed connections`;
  return `${m.count} × ${m.count} woven lines`;
}
// Every frame is a pure function of the generated model and breath amplitude.
// Exhaling retraces inhaling, returning exactly to the initial geometry.
function render(canvas,m,amount,thumbnail=false) {
  const bounds=canvas.getBoundingClientRect();
  const w=bounds.width,h=bounds.height,dpr=Math.min(devicePixelRatio||1,2);
  if(!w||!h)return;
  if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);}
  const ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
  const a=reduced?.42:amount;
  const room=thumbnail?h:h-85;
  const radius=Math.min(w*.3,room*.43,thumbnail?44:240);
  ctx.translate(w/2,thumbnail?h/2:(h-62)/2);
  ctx.scale(radius,radius);ctx.lineWidth=(thumbnail?.65:1)/radius;
  const color=opacity=>`hsla(${m.hue},28%,77%,${opacity})`;
  function path(points,opacity,close=false){ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));if(close)ctx.closePath();ctx.strokeStyle=color(opacity);ctx.stroke();}
  function dot(x,y,size=1.7,opacity=.8){ctx.beginPath();ctx.arc(x,y,(thumbnail?size*.65:size)/radius,0,TAU);ctx.fillStyle=color(opacity);ctx.fill();}
  ctx.rotate(m.rotation);
  if(m.family==='lattice') {
    const scale=lerp(.62,1,a),rings=[];
    for(let r=0;r<m.rings;r++) {
      const distance=scale*(r+1)/m.rings;
      const twist=(r%2?1:-1)*m.twist*a;
      const vertices=Array.from({length:m.spokes},(_,i)=>{const angle=i*TAU/m.spokes+twist;return [Math.cos(angle)*distance,Math.sin(angle)*distance];});
      rings.push(vertices);path(vertices,.18+r/m.rings*.29,true);
      if(r>0) vertices.forEach((p,i)=>{path([rings[r-1][i],p],.2);path([rings[r-1][(i+m.skip)%m.spokes],p],.09+a*.13);});
    }
    rings.at(-1).forEach(([x,y])=>dot(x,y,1.6));dot(0,0,2,.7);
  } else if(m.family==='polygons') {
    for(let layer=0;layer<m.layers;layer++) {
      const f=layer/(m.layers-1),r=lerp(.19,.97,f)*lerp(.72,1,a);
      const turn=layer*m.step + (layer%2?1:-1)*m.twist*a*m.direction;
      const vertices=Array.from({length:m.sides},(_,i)=>{const angle=i*TAU/m.sides+turn;return [Math.cos(angle)*r,Math.sin(angle)*r];});
      path(vertices,lerp(.22,.64,f),true);
      if(layer===m.layers-1)vertices.forEach(([x,y])=>dot(x,y,1.7,.8));
    }
  } else if(m.family==='constellation') {
    const pts=m.points.map(p=>[p.x*lerp(.66,1.12,a)+Math.cos(p.phase)*a*.08,p.y*lerp(.66,1.12,a)+Math.sin(p.phase)*a*.08]);
    m.edges.forEach(([i,j])=>path([pts[i],pts[j]],.16+a*.13));
    pts.forEach(([x,y],i)=>dot(x,y,m.points[i].weight*1.8,.48+a*.35));
  } else {
    ctx.rotate(-m.rotation+m.tilt);
    function warp(x,y){const dist=Math.hypot(x,y);const falloff=Math.max(0,1-dist/1.5);const wave=Math.sin(dist*m.frequency*Math.PI+m.phase);const stretch=1+a*.2;return [x*stretch+x*falloff*wave*m.bend*a,y*stretch+y*falloff*wave*m.bend*a];}
    for(let i=0;i<m.count;i++) {
      const v=lerp(-.75,.75,i/(m.count-1));
      const horizontal=[],vertical=[];
      for(let j=0;j<=48;j++){const t=lerp(-.85,.85,j/48);horizontal.push(warp(t,v));vertical.push(warp(v,t));}
      const opacity=.18+.32*(1-Math.abs(v));path(horizontal,opacity);path(vertical,opacity);
    }
  }
  ctx.setTransform(1,0,0,1,0,0);
}
const params=new URLSearchParams(location.search);
let seed=(params.get('seed')||newSeed()).slice(0,48);
let family=Object.hasOwn(names,params.get('family'))?params.get('family'):'lattice';
let mode=params.get('mode')==='overlay'?'overlay':'study';
let models={},frame=0,elapsed=0,lastTime=null,paused=false,complete=false,lastPhase='',currentAmount=0;
function updateURL(){const url=new URL(location.href);url.searchParams.set('seed',seed);url.searchParams.set('family',family);url.searchParams.set('mode',mode);history.replaceState(null,'',url);}
function updateSelection(){
  $$('.family').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.family===family)));
  $$('[data-mode]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.mode===mode)));
  $('#family-name').textContent=names[family];$('#signature').replaceChildren(document.createTextNode(describe(models[family])));
  const fingerprint=document.createElement('span');fingerprint.textContent=hash(seed+'::'+family).toString(16).padStart(8,'0');$('#signature').append(fingerprint);
  updateURL();
}
function regenerate(){models=Object.fromEntries(Object.keys(names).map(f=>[f,generate(seed,f)]));$('#seed').value=seed;updateSelection();restart();}
function setPhase(name,text){if(lastPhase!==name){lastPhase=name;$('#status').textContent=text;}}
function reveal(){complete=true;$('#scene').style.opacity=0;$('#veil').style.opacity=1;$('#reflection').classList.add('visible');$('#reflection').style.opacity=1;$('#reflection').inert=false;$('#reflection').setAttribute('aria-hidden','false');$('#skip').hidden=true;$('#pause').disabled=true;setPhase('reflect','Reflection · preview only');}
function paint(){
  const [inhale,exhale]=$('#pace').value.split(',').map(Number),cycle=inhale+exhale;
  const t=Math.max(0,elapsed-2),within=mode==='study'?t%cycle:Math.min(t,cycle);
  const amount=within<inhale?ease(within/inhale):1-ease((within-inhale)/exhale);
  currentAmount=amount;
  $('#veil').style.opacity=ease(elapsed/1.8);
  $('#scene').style.opacity=ease((elapsed-.5)/1.3)*(mode==='overlay'?1-ease((t-cycle)/1.1):1);
  $('#progress').style.transform=`scaleX(${clamp(within/cycle)})`;
  $('#skip').hidden=mode!=='overlay'||elapsed<1.8||t>=cycle;
  if(elapsed<2){setPhase('arriving','Arriving');$('#cue').textContent='Breathe in';}
  else if(mode==='overlay'&&t>=cycle){setPhase('settling','Settling');}
  else {const phase=within<inhale?'inhale':'exhale';const cue=phase==='inhale'?'Breathe in':'Breathe out';setPhase(phase,cue);$('#cue').textContent=cue;}
  render($('#geometry'),models[family],amount);
  $$('.family').forEach(el=>render(el.querySelector('canvas'),models[el.dataset.family],amount,true));
  if(mode==='overlay'&&t>cycle+.8){$('#reflection').classList.add('visible');$('#reflection').style.opacity=ease((t-cycle-.8)/1.2);}
  if(mode==='overlay'&&t>=cycle+2)reveal();
}
function tick(now){
  if(paused||complete||document.hidden){lastTime=null;return;}
  if(lastTime!==null)elapsed+=(now-lastTime)/1000;
  lastTime=now;paint();if(!complete)frame=requestAnimationFrame(tick);
}
function restart(){
  cancelAnimationFrame(frame);elapsed=0;lastTime=null;paused=false;complete=false;lastPhase='';
  $('#pause').textContent='Pause';$('#pause').setAttribute('aria-pressed','false');$('#pause').disabled=false;
  $('#reflection-input').blur();$('#reflection-input').value='';$('#saved').textContent='';
  $('#reflection').classList.remove('visible');$('#reflection').style.opacity=0;$('#reflection').inert=true;$('#reflection').setAttribute('aria-hidden','true');
  paint();frame=requestAnimationFrame(tick);
}
$$('.family').forEach(button=>button.addEventListener('click',()=>{family=button.dataset.family;updateSelection();restart();}));
$$('[data-mode]').forEach(button=>button.addEventListener('click',()=>{mode=button.dataset.mode;updateSelection();restart();}));
$('#seed-form').addEventListener('submit',event=>{event.preventDefault();const value=$('#seed').value.trim();if(!value){$('#seed').focus();return;}seed=value;regenerate();});
$('#reroll').addEventListener('click',()=>{seed=newSeed();regenerate();});
$('#replay').addEventListener('click',restart);$('#pace').addEventListener('change',restart);
$('#pause').addEventListener('click',()=>{paused=!paused;$('#pause').textContent=paused?'Resume':'Pause';$('#pause').setAttribute('aria-pressed',String(paused));cancelAnimationFrame(frame);lastTime=null;if(!paused)frame=requestAnimationFrame(tick);});
$('#skip').addEventListener('click',()=>{cancelAnimationFrame(frame);reveal();});
$('#reflection').addEventListener('submit',event=>{event.preventDefault();$('#saved').textContent=$('#reflection-input').value.trim()?'Preview only — not saved':'';});
$('#fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await $('#stage').requestFullscreen();}catch{$('#status').textContent='Full screen unavailable';}});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&mode==='overlay'&&!complete){cancelAnimationFrame(frame);reveal();}});
document.addEventListener('visibilitychange',()=>{cancelAnimationFrame(frame);lastTime=null;if(!document.hidden&&!paused&&!complete)frame=requestAnimationFrame(tick);});
new ResizeObserver(()=>{if(models[family]){render($('#geometry'),models[family],currentAmount);$$('.family').forEach(el=>render(el.querySelector('canvas'),models[el.dataset.family],currentAmount,true));}}).observe($('#stage'));
if(reduced)$('#note').textContent='Reduced motion · fixed geometry, gentle fades, timed breath cues.';
regenerate();
</script>
</body>
</html>
